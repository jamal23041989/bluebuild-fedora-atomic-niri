# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: bluebuild-fedora-atomic-niri
description: My custom Fedora Atomic image with Niri WM
base-image: ghcr.io/blue-build/base-images/fedora-base
image-version: 44

modules:
  # 1. Сначала активируем репозитории COPR для утилит Hyprland и Yazi
  - type: dnf
    repos:
      copr:
        - solopasha/hyprland # Здесь лежат hyprlock, hypridle и uwsm
        - lihaohong/yazi # Здесь лежит актуальный yazi

  # 2. Теперь запускаем установку пакетов с правильными именами
  - type: rpm-ostree
    install:
      - mesa-dri-drivers
      - mesa-vulkan-drivers
      - libva-utils
      - niri
      - xwayland-satellite
      - waybar
      - fuzzel
      - mako
      - swaybg
      - alacritty
      - wl-clipboard
      - adwaita-cursor-theme
      - greetd
      - tuigreet
      - xdg-desktop-portal
      - xdg-desktop-portal-gnome
      - xdg-desktop-portal-gtk
      - NetworkManager
      - NetworkManager-tui
      - iwd
      - firewalld
      - bluez # Заменяет bluez-utils
      - pipewire
      - pipewire-pulseaudio # Исправлено с pipewire-pulse
      - wireplumber
      - pavucontrol
      - udiskie
      - udisks2
      - upower
      - brightnessctl
      - lxqt-policykit
      - gnome-keyring
      - libsecret
      - podman
      - podman-docker
      - distrobox
      - flatpak
      - git
      - zsh
      - tmux
      - neovim
      - bat
      - eza
      - fzf
      - ripgrep
      - zoxide
      - btop
      - wget
      - zip
      - unzip
      - fd-find
      - git-delta
      - pass
      - mpv
      - imv
      - zathura
      - zathura-pdf-mupdf
      - ffmpegthumbnailer
      - ImageMagick # Исправлен регистр
      - p7zip
      - unar
      - poppler-utils

      # Пакеты из COPR теперь найдутся без проблем:
      - uwsm
      - hyprlock
      - hypridle
      - yazi

  # 3. Настройка системных служб (оставляем как у тебя)
  - type: systemd
    system:
      enabled:
        - greetd
        - NetworkManager
        - firewalld
        - bluetooth
