name: Build and Validate Fedora Atomic Niri
on:
  schedule:
    - cron: "0 0 * * 1"
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"
      - ".gitignore"
      - "cosign.pub"
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  bluebuild:
    name: Build and Validate Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      # 1. Клонируем репозиторий
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Собираем контейнер (без проблемных параметров ISO)
      - name: Build Image
        id: build
        uses: blue-build/github-action@v1
        with:
          recipe: "recipe.yml"
          registry_token: ${{ github.token }}
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          pr_event_number: ${{ github.event.number }}
          push: ${{ github.event_name != 'pull_request' }}

      # 3. Генерируем ISO, пропуская скачивание внешней "базы"
      - name: Generate ISO
        if: github.event_name != 'pull_request'
        run: |
          sudo apt-get update && sudo apt-get install -y podman
          sudo podman run --privileged --rm \
            -v ./config:/config \
            -v .:/output \
            ghcr.io/jasonn3/build-container-installer:v1.4.0 \
            IMAGE=ghcr.io/${{ github.repository_owner }}/bluebuild-fedora-atomic-niri \
            VERSION=44 \
            ISO_NAME=fedora-niri.iso \
            VARIANT=Minimal \
            SKIP_CONTAINER=1

      # 4. Принудительно выгружаем готовый ISO в артефакты GitHub
      - name: Upload ISO Artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: fedora-niri-iso
          path: ./fedora-niri.iso
          if-no-files-found: error
          retention-days: 7
